<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <radialGradient id="indigoAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#6366f1" stroke-opacity="0.3" stroke-width="4" />
  <circle cx="256" cy="256" r="200" fill="url(#indigoAura)" />

  <g filter="url(#glow)">
    <!-- Speech Globe / AI Sparkle Base -->
    <path d="M 140 240 C 140 160 372 160 372 240 C 372 320 280 340 256 360 C 232 340 140 320 140 240 Z" fill="url(#indigoGrad)" />
    <!-- AI Sparkle Core -->
    <path d="M 256 160 L 268 200 L 308 212 L 268 224 L 256 264 L 244 224 L 204 212 L 244 200 Z" fill="#ffffff" />
    <!-- Monogram LA -->
    <text x="256" y="305" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="105" letter-spacing="4">LA</text>
  </g>

  <!-- Title Badge -->
  <text x="256" y="415" text-anchor="middle" fill="url(#indigoGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="6">MONTANHA</text>
  <text x="256" y="445" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="4">LANGUAGE AI</text>
</svg>
