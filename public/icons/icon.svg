<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Círculo interno decorativo sutil -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.25" />

  <!-- Balão de Fala Principal -->
  <g filter="url(#dropShadow)">
    <path d="M128 160 C128 124.65 156.65 96 192 96 L320 96 C355.35 96 384 124.65 384 160 L384 272 C384 307.35 355.35 336 320 336 L240 336 L176 392 L176 336 L192 336 C156.65 336 128 307.35 128 272 Z" fill="url(#bubbleGrad)" />
  </g>

  <!-- Letra 'S' e 'L' / Ondas de Som e Idioma -->
  <!-- Letra S estilizada em azul escuro -->
  <path d="M215 175 C205 175 190 180 190 195 C190 220 235 210 235 235 C235 250 215 255 200 255 C185 255 175 248 172 245" fill="none" stroke="#1d4ed8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Letra L estilizada -->
  <path d="M265 175 L265 255 L305 255" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Ondas Sonoras Dinâmicas (Fala e Áudio) -->
  <path d="M335 190 C345 202 345 228 335 240" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" />
  <path d="M352 178 C370 198 370 232 352 252" fill="none" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" />

  <!-- Estrela de IA Brilhante no Topo -->
  <path d="M340 120 L346 134 L360 140 L346 146 L340 160 L334 146 L320 140 L334 134 Z" fill="#fbbf24" />
</svg>
